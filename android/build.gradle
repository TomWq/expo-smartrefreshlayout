buildscript {
  ext.ExpoSmartRefreshLayout = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : ExpoSmartRefreshLayout[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

android {
  namespace "com.exposmartrefreshlayout"
  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.core:core:1.13.1"
  implementation "androidx.recyclerview:recyclerview:1.3.2"
  implementation "androidx.viewpager2:viewpager2:1.1.0"
  implementation "io.github.scwang90:refresh-layout-kernel:3.0.0-alpha"
  implementation "io.github.scwang90:refresh-header-classics:3.0.0-alpha"
  implementation "io.github.scwang90:refresh-header-material:3.0.0-alpha"
  implementation "io.github.scwang90:refresh-footer-classics:3.0.0-alpha"
}
